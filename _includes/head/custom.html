<style>
  /* 1. 彻底隐藏文章列表里的日期块（消灭撑开标题与摘要的元凶） */
  .archive__item .page__meta,
  .list__item .page__meta,
  .entries-list .page__meta {
    display: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
  }

  /* 2. 严格实现“紧凑又清晰”的列表排版（全站首页与分类页通用） */
  .entries-list,
  .list__item {
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 砍掉多余空白：每篇文章上下内边距固定为紧凑的 14px，仅保留底部 1 条细分割线 */
  .list__item .archive__item {
    margin: 0 !important;
    padding: 14px 8px !important;
    border-top: none !important;
    border-bottom: 1px solid #DCDCD6 !important;
    transition: background-color 0.15s ease !important;
  }

  /* 桌面/平板端悬停导引：鼠标移上去浮现极淡暖灰底色 */
  .list__item .archive__item:hover {
    background-color: rgba(20, 20, 19, 0.03) !important;
  }

  /* 标题层级：19px 深墨黑 (#141413) + 半加粗，底部仅隔 5px */
  .list__item .archive__item-title {
    margin: 0 0 5px 0 !important;
    padding: 0 !important;
    font-family: "Songti SC", "STSong", "Source Han Serif SC", Georgia, serif !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    line-height: 1.38 !important;
    color: #141413 !important;
    border: none !important;
  }

  .list__item .archive__item-title a {
    color: #141413 !important;
    text-decoration: none !important;
  }

  .list__item .archive__item-title a:hover {
    color: #555550 !important;
  }

  /* 摘要层级：紧贴标题下方，14.5px 中深灰 (#555552) + 无衬线体，最多显示 2 行 */
  .list__item .archive__item-excerpt,
  .list__item .archive__item-excerpt p {
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif !important;
    font-size: 14.5px !important;
    font-weight: 400 !important;
    line-height: 1.55 !important;
    color: #555552 !important;
    display: -webkit-box !important;
    -webkit-line-clamp: 2 !important;
    -webkit-box-orient: vertical !important;
    overflow: hidden !important;
  }

  /* 3. 文章内页处理：隐藏顶部巨幅大图，右侧图与目录齐平 */
  .page__hero {
    display: none !important;
  }

  .toc-top-image {
    display: block !important;
    margin-bottom: 24px !important;
    padding: 6px !important;
    background: #FFFFFF !important;
    border: 1px solid #DCDCD6 !important;
    box-sizing: border-box !important;
  }

  .toc-top-image img {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    max-height: 240px !important;
    object-fit: contain !important;
    margin: 0 auto !important;
  }

  @media (min-width: 64em) {
    .page__inner-wrap {
      position: relative !important;
    }
    .page .page__title {
      margin-top: 0 !important;
      margin-bottom: 1.2rem !important;
    }
    .page .page__content {
      clear: none !important;
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    .sidebar__right {
      position: absolute !important;
      top: 0 !important;
      right: -265px !important;
      width: 240px !important;
      float: none !important;
      margin: 0 !important;
      padding-left: 1.25rem !important;
      z-index: 10 !important;
    }
  }

  /* 4. 恢复左侧菜单栏小图标与对齐 */
  .author__urls li i,
  .author__urls li .fas,
  .author__urls li .fab,
  .author__urls li .far,
  .author__urls li .fa {
    display: inline-block !important;
    width: 1.6em !important;
    text-align: center !important;
    margin-right: 6px !important;
    color: #262626 !important;
    font-size: 15px !important;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var hero = document.querySelector(".page__hero");
  var heroImg = document.querySelector(".page__hero-image");
  var innerWrap = document.querySelector(".page__inner-wrap");
  var rightSidebar = document.querySelector(".sidebar__right");

  if (hero) {
    hero.style.setProperty("display", "none", "important");
  }

  if (innerWrap && (rightSidebar || heroImg)) {
    if (!rightSidebar && heroImg) {
      rightSidebar = document.createElement("aside");
      rightSidebar.className = "sidebar__right";
      innerWrap.appendChild(rightSidebar);
    }

    if (rightSidebar && heroImg && !rightSidebar.querySelector(".toc-top-image")) {
      var imgWrap = document.createElement("div");
      imgWrap.className = "toc-top-image";
      var clonedImg = heroImg.cloneNode(true);
      clonedImg.removeAttribute("style");
      imgWrap.appendChild(clonedImg);
      rightSidebar.insertBefore(imgWrap, rightSidebar.firstChild);
    }
  }
});
</script>

<!-- end custom head snippets -->
