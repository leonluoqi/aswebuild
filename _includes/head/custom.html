<style>
  /* 1. 隐藏首页自动生成的默认大标题与“最新文章”副标题 */
  .layout--home #page-title,
  .layout--home .archive > .page__title,
  .layout--home .archive__subtitle {
    display: none !important;
  }

  /* 2. 隐藏文章列表里的日期块，消除标题与摘要之间的横线与空洞 */
  .archive__item .page__meta,
  .list__item .page__meta,
  .entries-list .page__meta {
    display: none !important;
  }

  /* 3. 首页与分类页：紧凑文章列表样式（确保摘要正常显示） */
  .entries-list,
  .list__item {
    margin: 0 !important;
    padding: 0 !important;
  }

  .list__item .archive__item {
    margin: 0 !important;
    padding: 14px 6px !important;
    border-top: none !important;
    border-bottom: 1px solid #DCDCD6 !important;
    transition: background-color 0.15s ease !important;
  }

  .list__item .archive__item:hover {
    background-color: rgba(20, 20, 19, 0.025) !important;
  }

  .list__item .archive__item-title {
    margin: 0 0 6px 0 !important;
    padding: 0 !important;
    font-family: "Songti SC", "STSong", "Source Han Serif SC", Georgia, serif !important;
    font-size: 22px !important;
    font-weight: 600 !important;
    line-height: 1.38 !important;
    color: #141413 !important;
    border: none !important;
  }

  .list__item .archive__item-title a {
    color: #141413 !important;
    text-decoration: none !important;
  }

  .list__item .archive__item-excerpt {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif !important;
    font-size: 14.5px !important;
    font-weight: 400 !important;
    line-height: 1.6 !important;
    color: #555552 !important;
    overflow: visible !important;
  }

  .list__item .archive__item-excerpt p {
    margin: 0 !important;
    padding: 0 !important;
  }

  /* 4. 文章内页：隐藏顶部大图，让右侧“大图+目录”随着页面往下滚动跟随 (sticky) */
  .page__hero {
    display: none !important;
  }

  .toc-top-image {
    display: block !important;
    margin-bottom: 18px !important;
    padding: 5px !important;
    background: #FFFFFF !important;
    border: 1px solid #DCDCD6 !important;
    box-sizing: border-box !important;
  }

  .toc-top-image img {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    max-height: 180px !important;
    object-fit: contain !important;
    margin: 0 auto !important;
  }

  @media (min-width: 64em) {
    .page .page__title {
      margin-top: 0 !important;
      margin-bottom: 1.2rem !important;
    }

    .page .page__content {
      clear: none !important;
      margin-top: 0 !important;
      padding-top: 0 !important;
    }

    /* 关键修复：改回 position: sticky，让目录随着文章往下滚动一直跟着下来 */
    .sidebar__right,
    .sidebar__right.sticky {
      position: -webkit-sticky !important;
      position: sticky !important;
      top: 1.5rem !important;
      right: auto !important;
      float: right !important;
      width: 240px !important;
      margin-right: -265px !important;
      margin-top: -3.5rem !important; /* 初始位置上提，与正文大标题顶部齐平 */
      margin-bottom: 1rem !important;
      padding-left: 1.25rem !important;
      z-index: 10 !important;
    }
  }

  /* 5. 目录当前章节高亮显示（到了哪个目录，哪个目录就加粗+深色左边框+底色高亮） */
  .toc__menu li a {
    display: block !important;
    padding: 6px 8px !important;
    color: #555552 !important;
    font-size: 13.5px !important;
    line-height: 1.45 !important;
    border-left: 2px solid transparent !important;
    transition: all 0.15s ease !important;
  }

  .toc__menu li.active > a,
  .toc__menu li a.active {
    background-color: #E8E8E2 !important;
    color: #141413 !important;
    font-weight: 600 !important;
    border-left: 3px solid #141413 !important;
    padding-left: 10px !important;
  }

  /* 6. 恢复左侧菜单栏小图标与对齐 */
  .author__urls li i,
  .author__urls li .fas,
  .author__urls li .fab,
  .author__urls li .far,
  .author__urls li .fa {
    display: inline-block !important;
    width: 1.6em !important;
    text-align: center !important;
    margin-right: 6px !important;
    color: #262626 !important;
    font-size: 15px !important;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var hero = document.querySelector(".page__hero");
  var heroImg = document.querySelector(".page__hero-image");
  var pageContent = document.querySelector(".page__content");
  var rightSidebar = document.querySelector(".sidebar__right");

  // 1. 隐藏顶部巨幅头图
  if (hero) {
    hero.style.setProperty("display", "none", "important");
  }

  // 2. 将头图放入右侧目录正上方（保持在 .page__content 内部，这样 sticky 才能跟随全文滚动）
  if (pageContent && (rightSidebar || heroImg)) {
    if (!rightSidebar && heroImg) {
      rightSidebar = document.createElement("aside");
      rightSidebar.className = "sidebar__right sticky";
      pageContent.insertBefore(rightSidebar, pageContent.firstChild);
    }

    if (rightSidebar && heroImg && !rightSidebar.querySelector(".toc-top-image")) {
      var imgWrap = document.createElement("div");
      imgWrap.className = "toc-top-image";
      var clonedImg = heroImg.cloneNode(true);
      clonedImg.removeAttribute("style");
      imgWrap.appendChild(clonedImg);
      rightSidebar.insertBefore(imgWrap, rightSidebar.firstChild);
    }
  }

  // 3. 章节滚动监听：读到哪个章节，右侧目录对应条目自动高亮显示
  var tocLinks = document.querySelectorAll(".toc__menu a");
  if (tocLinks.length > 0) {
    var headings = [];
    tocLinks.forEach(function(link) {
      var rawHref = link.getAttribute("href") || "";
      var id = decodeURIComponent(rawHref).replace(/^#/, "");
      var target = id ? (document.getElementById(id) || document.getElementById(rawHref.replace(/^#/, ""))) : null;
      if (target) {
        headings.push({ link: link, target: target });
      }
    });

    function updateActiveToc() {
      var current = headings[0];
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].target.getBoundingClientRect().top <= 150) {
          current = headings[i];
        }
      }
      tocLinks.forEach(function(link) {
        link.classList.remove("active");
        if (link.parentElement) link.parentElement.classList.remove("active");
      });
      if (current) {
        current.link.classList.add("active");
        if (current.link.parentElement) current.link.parentElement.classList.add("active");
      }
    }

    window.addEventListener("scroll", updateActiveToc, { passive: true });
    updateActiveToc();
  }
});
</script>
