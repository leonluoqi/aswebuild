<!-- As We Build 邮箱订阅组件 -->
<div style="margin-top: 2.5em; padding: 1.6em 1.8em; background-color: #f8f9fa; border: 1px solid #e5e7eb; border-left: 4px solid #000000; border-radius: 6px;">
  <h3 style="margin-top: 0; margin-bottom: 0.4em; font-size: 1.15em; font-weight: 700; color: #111111;">订阅 As We Build</h3>
  <p style="font-size: 0.9em; margin-bottom: 1.2em; color: #555555; line-height: 1.5;">
    第一时间获取北美轻资产创业、商业模式拆解与实战案例。
  </p>
  
  <form action="https://submit-form.com/kxienKoQo" method="POST" style="display: flex; gap: 10px; flex-wrap: wrap;">
    <!-- Formspark 防垃圾蜜罐 -->
    <input type="checkbox" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
    
    <!-- 邮箱输入框 -->
    <input type="email" name="email" placeholder="输入你的常用邮箱..." required 
           style="flex: 1; min-width: 220px; padding: 10px 14px; background: #ffffff; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9em; color: #111827; outline: none;" />
    
    <!-- #ff6600 品牌橙色按钮 -->
    <button type="submit" 
            style="margin: 0; padding: 10px 14px; background-color: #ff6600; color: #ffffff; font-weight: 600; font-size: 0.7em; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.2s;"
            onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'">
      立即订阅
    </button>
  </form>
</div>
