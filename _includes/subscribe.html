<!-- As We Build 邮箱订阅组件 -->
<div class="notice--info" style="margin-top: 2.5em; padding: 1.5em; border-radius: 8px; border-left: 4px solid #3b82f6;">
  <h3 style="margin-top: 0; margin-bottom: 0.3em; font-size: 1.15em;">📬 订阅 As We Build</h3>
  <p style="font-size: 0.9em; margin-bottom: 1.2em; color: #555; line-height: 1.5;">
    留下邮箱，第一时间获取北美轻资产创业、商业模式拆解与实战案例。
  </p>
  
  <form action="https://submit-form.com/kxienKoQo" method="POST" style="display: flex; gap: 8px; flex-wrap: wrap;">
    <!-- 1. Formspark 专属防垃圾蜜罐字段（真实用户不可见，机器人自动填写后会被直接拦截） -->
    <input type="checkbox" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
    
    <!-- 2. 邮箱输入框 -->
    <input type="email" name="email" placeholder="输入你的常用邮箱..." required 
           style="flex: 1; min-width: 220px; padding: 10px 14px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em; outline: none;" />
    
    <!-- 3. Minimal Mistakes 原生主色调按钮 -->
    <button type="submit" class="btn btn--primary" style="margin: 0; padding: 10px 22px; font-size: 0.95em; cursor: pointer;">
      立即订阅
    </button>
  </form>
</div>
